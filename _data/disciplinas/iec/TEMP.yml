    autores: "Thiago Thibes, Rafael A. Fonseca, Murilo F. Marcelino"
    descricao: "A nossa startup tem como o objetivo a reciclagem de pilas e baterias, através de um processo de reciclagem mais eficiente, capaz de recuperar matérias valiosos , apoiando a transição para uma economia mais circular."
    iframe: "https://www.youtube.com/embed/Mwv6E2ycSHI" 
    github:

    - nome: "GRUPO 9: EnxergaFacil"
    autores: "Lucas G. Lyra, Arthur Gabriel de S. Costa "
    descricao: "A solução funciona em quatro etapas principais: primeiro, a câmera captura o ambiente à frente do usuário. Depois, a IA embarcada interpreta a imagem localmente. Em seguida, o sistema classifica o risco, como buracos, degraus ou objetos no caminho. Por fim, o usuário recebe um alerta simples por vibração ou som, indicando direção e proximidade do obstáculo."
    iframe: "https://www.youtube.com/embed/aoIPVhEO98I" 
    github:
    
    - nome: "GRUPO 10: SmartTrash"
    autores: "Marcos Gabriel C. Surlo"
    descricao: "Queremos que a SmartTrash deixe de ser apenas uma plataforma e se torne uma parceira estratégica das cidades inteligentes, fornecendo dados que tornem a gestão pública mais eficiente, econômica e sustentável."
    iframe: "https://www.youtube.com/embed/4QUumMKbzq0" 
    github:

    - nome: "GRUPO 11: GreenChain"
    autores: "Eduardo Evangelista, Marcos Brunetti, Nicolas Marques, Pedro Pavesi"
    descricao: "GreenChain é uma startup que utiliza tecnologia blockchain para tornar o mercado de créditos de carbono mais transparente, seguro e confiável. Nossa plataforma registra todo o ciclo de vida dos créditos, reduzindo fraudes, eliminando a dupla contagem e facilitando auditorias em tempo quase real. Com o apoio de inteligência artificial, imagens de satélite e contratos inteligentes, buscamos fortalecer projetos ambientais, incentivar a descarbonização e promover um futuro mais sustentável."
    iframe: "https://www.youtube.com/embed/0RAKnvVkUXg" 
