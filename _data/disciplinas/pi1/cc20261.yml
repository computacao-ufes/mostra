projetos:
  - nome: "Academic Pinpoint"
    autores: "Rodolfo Reetz da Silva, Tiago Machado dos Santos, Victor Dutra de Jesus"
    descricao: "Para um estudante, se manter constantemente atualizado e organizado em relação a editais, cursos, eventos, estágios e bolsas, etc., durante sua formação pode ser bem desafiador. Ter de acessar uma grande quantidade de plataformas para procurar por informações pode ser um processo desgastante e ineficaz em muitos casos. O propósito do Academic Pinpoint é reunir e organizar informações dispersas em um único lugar, ajudando o estudante a descobrir novas oportunidades que possam potencializar sua vida acadêmica e profissional."
    iframe: "https://www.youtube.com/embed/cpzhoozdGUo?si=yVLEbD_3Zp4M2tiN"
    github: "https://github.com/reetzRS/Academic-Pinpoint.git"

  - nome: "Achados e Perdidos"
    autores: "Bernardo Lima Seibert, Rafael Alves Gomes Lima"
    descricao: "Objetos pessoais são frequentemente perdidos ou encontrados em salas, laboratórios, bibliotecas, corredores e demais espaços da universidade. Sem um canal centralizado, a comunicação costuma acontecer de forma dispersa, por grupos de mensagens, redes sociais ou avisos informais. Isso dificulta o encontro entre quem perdeu um objeto e quem o encontrou. O sistema de Achados e Perdidos busca centralizar essas informações em uma aplicação web. Por meio dela, a comunidade universitária poderá publicar anúncios, consultar objetos registrados e acompanhar se uma ocorrência ainda está ativa ou já foi resolvida."
    iframe: "https://www.youtube.com/embed/0vKa46F1Tsk?si=BuP-xyIgoyy0Eecb"
    github: "https://github.com/Rafael-Alves233/achados-e-perdidos"

  - nome: "BuukMatch"
    autores: "Marina Bragatto Pereira, Ronald de Lima Alves, Thais Gomes Brandao"
    descricao: "A BuukMatch é uma plataforma que tem como propósito conectar leitores por meio de troca de itens literários. O sistema busca unir amantes de livros por meio de um ambiente de troca que funciona por meio de publicações dos itens que se deseja desapegar. Diferente de uma simples doação, nosso produto visa o engajamento de ambas as partes, sendo necessário ocorrer um interesse mútuo entre os usuários. Além disso, é uma plataforma que permite troca de mensagens e feed interativo."
    iframe: "https://www.youtube.com/embed/di8wMbXk-Qw?si=FGR0qCfOUHMvvDgb"
    github: "https://github.com/thaisssssssssss/BuukMatch"

  - nome: "Ct_Forum"
    autores: "Leticia Mariana Da Silva Ferreira, Paulo Sergio Amorim Monico, Vitor Soprani Passamani"
    descricao: "O CT Forum tem como objetivo ser um fórum para os alunos do Centro Tecnológico, onde possam interagir; compartilhar informações, vivências da universidade, avisos, dicas de estudo etc."
    iframe: "https://www.youtube.com/embed/S4O2Gevp1SE?si=Zlh8M3UUM_GinV3A"
    github: "https://github.com/paulosergioamorim/ct_forum/tree/main"

  - nome: "DependencyHeaven"
    autores: "Davi Altafim Santana, Francisco Vassoler Merizio, Paula Marques Monteverde"
    descricao: "O Dependency Heaven é uma aplicação web para organização e gerenciamento de projetos por meio de tarefas dependentes. O sistema utiliza conceitos de grafos para controlar automaticamente a ordem de execução das etapas, indicando quais tarefas precisam ser concluídas antes que outras possam começar. A proposta é facilitar o planejamento de projetos, oferecendo uma interface interativa e centralizada para estruturar ideias, tarefas e suas relações de dependência."
    iframe: "https://www.youtube.com/embed/_HUkt0JnOOs?si=5j8uKp-sLPWj74Vm"
    github: "https://github.com/Merizio/DependencyHeaven.git"

  - nome: "Dishd"
    autores: "Eduardo Capobiango Ferraz, Mateus Biancardi da Silva, Ricardo Modenese Ramalho"
    descricao: "O Dishd é um diário social de gastronomia da Grande Vitória. Nele, o usuário registra os restaurantes que visitou com nota, comentário e foto do prato, montando seu histórico gastronômico pessoal. Também serve para descobrir onde comer: o catálogo reúne restaurantes reais da região, com filtros por categoria, ranking dos mais bem avaliados e as opiniões da comunidade"
    iframe: "https://www.youtube.com/embed/e-E2zRS9hxg?si=IiLXxhyy5rtLW1Qs"
    github: "https://github.com/Eduardo-Ferraz/dishd"

  - nome: "Divide Aí"
    autores: "David Marques de Oliveira Leal, Emilly Lopes das Neves"
    descricao: "O DivideAi é um aplicativo Android projetado para simplificar a divisão de despesas entre amigos, familiares e grupos. Ele permite que os usuários registrem despesas, dividam os custos de forma justa e acompanhem quem deve a quem, tornando a gestão financeira de atividades em grupo mais fácil e transparente."
    iframe: "https://www.youtube.com/embed/Pi95U1yMPNY?si=5Z-f2qsPuLShC_zf"
    github: "https://github.com/DavidMarquesss/Divideai"

  - nome: "Gerencia PET"
    autores: "Joao Vitor Soares dos Santos, Lucas D’Amato Nitz, Pedro Alexandre Simoes Lorenzutti"
    descricao: "O Gerência PET é uma plataforma que tem como objetivo centralizar e otimizar a gestão e a divulgação das atividades promovidas pelos diversos grupos PET da Universidade Federal do Espírito Santo (Ufes). Nela, é possível visualizar informações sobre cursos, workshops e processos seletivos, além de realizar a matrícula nesses eventos com apenas um clique. A ferramenta também facilita o controle de frequência, o cadastro de novos eventos e o lançamento de notas, auxiliando alunos extensionistas e tutores. Por fim, o sistema permite que o tutor emita certificados para os estudantes, tanto para os extensionistas quanto para aqueles que concluíram os cursos ofertados pelo respectivo PET."
    iframe: "https://www.youtube.com/embed/ZeGPkRnKnIo?si=rhg_KsIlBNwXepf6"
    github: "https://github.com/PAlorenzutti/PI"

  - nome: "PathUFES"
    autores: "Caio Costa Lopes, Daniel Olimpio Sbrocco, Miguel Zon Murad"
    descricao: "Diversos alunos encontram percalços durante a graduação. Dentre elas está a indecisão e a dificuldade de escolher quais matérias cursar ao longo dos semestres e qual o caminho mais vantajoso para se formar. Com o intuito de mitigar esse problema, foi criado o "Path UFES", uma aplicação web que busca sugerir e exibir um caminho rápido, viável e eficiente para que, estudantes da graduação de Ciência da Computação da Universidade Federal do Espírito Santo (UFES), possam se matricular e futuramente formar sem preocupar com quais matérias devem buscar e/ou realizar primeiro ao longo do curso."
    iframe: "https://www.youtube.com/embed/IVoLVV0cbPg?si=9755aT7i5HfZ_vyJ"
    github: "https://github.com/CaioCosta23/Path_UFES.git"

  - nome: "ScheduleGuide"
    autores: "Fabiola Meireles Vilaca, Igor Wandekochen Bittencourt, Rafael Vieira de Almeida"
    descricao: "O ScheduleGuide é um sistema pensado para ajudar estudantes no planejamento e execução de suas sessões de estudo, por meio da visualização dos objetivos e sugestão de cronogramas. Os usuários podem registrar os conteúdos que desejam estudar e o sistema pode gerar um cronograma, de acordo com os dados fornecidos. Também é possível que o usuário gerencie suas próprias sessões de estudo, iniciando-as manualmente."
    iframe: "https://www.youtube.com/embed/e3-2hG7mVL8?si=J88NExwuPJrE08sH"
    github: "https://github.com/fabiolameireles/ScheduleGuide"

  - nome: "Studex"
    autores: "Artur Vitor Cintra Bernardes, Felipe Pedrini Oliveira, Luiz Fernando de Souza Coutinho Cardoso"
    descricao: "O sistema tem como objetivo ajudar os alunos a estudar através de resumos, flashcards, mapas mentais gerados por uma Large Language Model (LLM). Todas essas funcionalidades estarão em um só lugar de fácil acesso e com o conteúdo estruturado de forma a priorizar o entendimento da matéria/assunto em questão. Outro ponto interessante do sistema, é que ele foi idealizado para gamificar os estudos, utilizando por exemplo um sistema de Hot-Streak/Heatmap, onde o usuário deve estudar todos os dias para conseguir manter sua sequência de estudos."
    iframe: "https://www.youtube.com/embed/xDsohrycid0?si=TEFA7LSqGXJrxfij"
    github: "https://github.com/lewislf/studex"

  - nome: "SuaPousada.com"
    autores: "Bruno Vale Lourenco, Rafael Rodrigues Matos, Yuri Tressmann Mutz"
    descricao: "O SuaPousada é um software de gerenciamento hoteleiro que simplifica a rotina de uma pousada. Dividido em dois painéis independentes — um para a equipe de administração e outro exclusivo para os clientes —, o projeto automatiza desde a realização de reservas e o cadastro de usuários até a visualização do histórico de hospedagem. Seu objetivo é reduzir processos manuais, evitar conflitos de agenda e proporcionar uma experiência mais ágil e transparente para todos."
    iframe: "https://www.youtube.com/embed/i3OU5_MrCnE?si=d0yV-u0vdOE1b8zI"
    github: "https://github.com/yurimutz/SuaPousada"

  - nome: "TaskSlayer"
    autores: "Gianluca Schmidt Mantovaneli, Talles Cavalleiro Weiler"
    descricao: "Um aplicativo para gerenciamento pessoal, o objetivo é que o usuário possa registrar hábitos, tarefas diárias e tarefas de longo prazo de modo gameficado para aumentar o incentivo em cumprir suas tarefas!"
    iframe: "https://www.youtube.com/embed/_-I5FHeyLSo?si=HbuyT3XJ7m5L_vgF"
    github: "https://github.com/Gianluca-Mantovaneli/Task-Slayer.git"

  - nome: "UniFlow"
    autores: "Pedro Marchini Pereira"
    descricao: "O UniFlow é uma aplicação web desenvolvida para ajudar estudantes universitários a organizarem melhor sua rotina acadêmica. O sistema permite cadastrar disciplinas, tarefas, prazos, prioridades e status, centralizando em um único ambiente informações que normalmente ficam espalhadas em cadernos, grupos de mensagens e plataformas diferentes."
    iframe: "https://www.youtube.com/embed/lVSQbQZqAHE?si=rGHMJ0Y7HZRQlwaf"
    github: "https://github.com/pedromarchini1/projeto_UniFlow"

  - nome: "Work and Rest"
    autores: "Joao Vitor Carvalho Pereira Rodrigues, Lucas Daniel Percebo Teixeira, Luiz Felipe Pereira Nolasco"
    descricao: "O work & rest é uma plataforma voltada para qualquer pessoa que esteja buscando mais foco em suas atividades. Baseada no método de estudos Pomodoro, você consegue utilizar os cronômetros automaticos pré-definidos da plataforma ou customizar seus próprios timers de acordo com seu gosto. Além disso, você pode acompanhar seu progresso e resultados de forma fácil através gráficos ou números absolutos para servir de motivação e sempre melhorar."
    iframe: "https://www.youtube.com/embed/JS7aSBVWsLE?si=oKi3jw89D8b3ZUNv"
    github: "https://github.com/LucasDanielP/Trabalho-PI1.git"