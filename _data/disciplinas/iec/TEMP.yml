    autores: "Ana Luisa Scalzer, Heitor Januario, Vinicius Sant'Ana"
    descricao: "Plataforma multimodal que utiliza a câmera do dispositivo para interpretar Libras e a fala humana simultaneamente e aumentar a acessibilidade para pessoas surdas."
    iframe: "https://www.youtube.com/embed/uyC3kepIPms" 
    github:

    - nome: "GRUPO 7: Nanoplastic"
    autores: "Diogo R. O. Bazani, Joel A. da Silva, Gabriel Henriques S. e Almeida"
    descricao: "A Nanoplastic é uma startup que faz coleta de plástico dos oceanos. Através da coleta de plásticos descartados no fundo do oceano e da pré-filtragem do microplástico, coletamos e diminuímos os plásticos no litoral. Por meio de nanotecnologia reestruturamos o plástico, para que seja inserido novamente na sua cadeia. O plástico produzido será vendido para empresas que fazem impressão 3D de próteses de membros para pessoas com deficiência física no Brasil."
    iframe: "https://www.youtube.com/embed/F68OdLmYd6s" 
    github:
    
